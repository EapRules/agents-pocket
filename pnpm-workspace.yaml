packages:
  - apps/*
  - packages/*
  - modules/*

# One React and one react-native for the whole repo (see docs/decisions/0009).
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1

# Build scripts allowed to run (pnpm 11 fails installs on unreviewed ones).
allowBuilds:
  "@parcel/watcher": true
  expo-libghostty: true

# Local fixes to dependencies, each meant to go upstream. expo-libghostty: the iOS
# terminal controller deletes its generated ghostty-config-*.conf right after loading
# it, and sweeps leftovers once per process (they piled up in the app's tmp folder).
# The iOS terminal view keeps its surface when it leaves a window (a foldable moving
# the app between displays emptied the grid) and frees it only when the view goes
# away; when a surface is freed it removes ghostty's IOSurfaceLayer from the view,
# because the bundled renderer leaves it with a callback into the freed renderer
# (a crash on the next resize; fixed upstream in ghostty 4b4a5b24).
patchedDependencies:
  expo-libghostty@0.8.1: patches/expo-libghostty@0.8.1.patch

# Dependencies a package uses but does not declare. @bacons/apple-targets requires
# @expo/plist at prebuild and lists it only as a devDependency; it resolved by hoisting
# until a dependency update stopped hoisting it.
packageExtensions:
  "@bacons/apple-targets@5.0.0":
    dependencies:
      "@expo/plist": ^0.10.2
