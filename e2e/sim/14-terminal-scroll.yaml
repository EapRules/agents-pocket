# A drag on the Agent's terminal reaches the fake TUI as wheel reports: its last line says how far
# back it stands. Maestro cannot read the Metal surface, so the proof is in the screenshots. The
# terminal opens in Keys (only the key toolbar over the keyboard, no Composer). The first tap raises
# the keyboard, which leaves the terminal at least the band from 17% to 33% of the screen (measured
# with the Composer under the toolbar too; one bar leaves it taller); every drag stays inside it,
# and the keyboard staying up shows a drag is not read as a tap.
appId: com.openagentspocket.app
---
- runFlow: _demo.yaml
- tapOn:
    id: inbox-p3
- extendedWaitUntil:
    visible:
      id: agent-header-sidebar
    timeout: 15000
- tapOn:
    id: agent-header-more
- tapOn: "Show Terminal"
- waitForAnimationToEnd
- runFlow: _guard.yaml
- extendedWaitUntil:
    notVisible:
      id: terminal-status
    timeout: 15000
- assertVisible:
    id: terminal-toolbar
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd
- takeScreenshot: design/atlas/sim/14-terminal-scroll-start
- swipe:
    start: "50%,19%"
    end: "50%,31%"
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: design/atlas/sim/14-terminal-scroll-slow-drag
- swipe:
    start: "50%,19%"
    end: "50%,31%"
    duration: 120
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: design/atlas/sim/14-terminal-scroll-flick
- swipe:
    start: "50%,31%"
    end: "50%,19%"
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: design/atlas/sim/14-terminal-scroll-back
- longPressOn:
    point: "50%,25%"
- waitForAnimationToEnd
- takeScreenshot: design/atlas/sim/14-terminal-scroll-long-press
- runFlow: _guard.yaml
