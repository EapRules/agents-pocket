# The Background Work strip opens its sheet and the sheet's body works. The demo Host has no
# conversation, so this uses the atlas state with work running. A row in a body collapsed to no
# height still reads as visible (the accessibility tree ignores the clip), so the proof is a tap:
# only a body that is really there lets a Workflow open to its agents.
appId: com.openagentspocket.app
---
- runFlow: _demo.yaml
- openLink: openagentspocket:///__atlas/agent-detail.chat-background-strip
- extendedWaitUntil:
    visible:
      id: background-work-strip-summary
    timeout: 15000
- tapOn:
    id: background-work-strip-summary
- extendedWaitUntil:
    visible:
      id: work-done
    timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: design/atlas/sim/15-background-work-sheet
- tapOn:
    id: work-sheet-w2
- extendedWaitUntil:
    visible:
      id: work-agent-k1
    timeout: 4000
- takeScreenshot: design/atlas/sim/15-background-work-agents
# Work runs, so Finished starts collapsed: its header opens it, which only a real section does.
- tapOn:
    id: work-section-finished-header-toggle
# The open Running section fills the screen, so the finished rows sit below the fold.
# A notice for a command the lines don't hold stands in as its finished row.
- scrollUntilVisible:
    element:
      id: work-sheet-notice:n1
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
# A finished Subagent's transcript is the dock's other sheet: it opens after this one has left.
- scrollUntilVisible:
    element:
      id: work-open-w3
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- takeScreenshot: design/atlas/sim/15-background-work-finished
- tapOn:
    id: work-open-w3
- extendedWaitUntil:
    notVisible:
      id: work-done
    timeout: 8000
- waitForAnimationToEnd
# Titled by its type, with the prompt it was given above its timeline.
- extendedWaitUntil:
    visible:
      id: subagent-prompt
    timeout: 8000
- takeScreenshot: design/atlas/sim/15-subagent-sheet
- runFlow: _guard.yaml
