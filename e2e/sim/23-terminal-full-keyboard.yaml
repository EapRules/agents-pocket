# Smoke: the key toolbar's keyboard button opens the full keyboard dock, whose rows fit the width.
appId: com.openagentspocket.app
---
- runFlow: _demo.yaml
- tapOn:
    id: inbox-p2
- extendedWaitUntil:
    visible:
      id: agent-header-sidebar
    timeout: 15000
- tapOn:
    id: agent-header-more
- tapOn: "Show Terminal"
- waitForAnimationToEnd
- runFlow: _guard.yaml
- extendedWaitUntil:
    visible:
      id: terminal-toolbar
    timeout: 5000
# The keyboard key sits past the capsule's edge on a phone: drag the keys to bring it in.
- swipe:
    from:
      id: toolbar-dPad
    direction: LEFT
- waitForAnimationToEnd
- tapOn:
    id: toolbar-keyboard
- extendedWaitUntil:
    visible:
      id: keys-dock
    timeout: 4000
- assertVisible:
    id: key-char-space
- takeScreenshot: design/atlas/sim/23-terminal-full-keyboard
