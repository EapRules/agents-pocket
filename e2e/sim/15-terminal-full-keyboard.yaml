# Smoke: the key toolbar's keyboard button opens the full keyboard dock, whose rows fit the width.
appId: com.openagentspocket.app
---
- runFlow: _demo.yaml
- tapOn:
    id: inbox-p2
- extendedWaitUntil:
    visible:
      id: agent-header-sidebar
    timeout: 15000
- tapOn:
    id: agent-header-more
- tapOn: "Show Terminal"
- waitForAnimationToEnd
- runFlow: _guard.yaml
- extendedWaitUntil:
    visible:
      id: terminal-toolbar
    timeout: 5000
- scrollUntilVisible:
    element:
      id: toolbar-keyboard
    direction: RIGHT
    optional: true
- tapOn:
    id: toolbar-keyboard
- extendedWaitUntil:
    visible:
      id: keys-dock
    timeout: 4000
- assertVisible:
    id: key-char-space
- takeScreenshot: design/atlas/sim/15-terminal-full-keyboard
