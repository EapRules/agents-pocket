# Smoke: the same Agent on its terminal surface: one input bar at a time, the key toolbar (Keys,
# the default) or the Composer (Compose), each with the control that swaps to the other.
appId: com.openagentspocket.app
---
- runFlow: _demo.yaml
- tapOn:
    id: inbox-p2
- extendedWaitUntil:
    visible:
      id: agent-header-sidebar
    timeout: 15000
- tapOn:
    id: agent-header-more
- tapOn: "Show Terminal"
- waitForAnimationToEnd
- runFlow: _guard.yaml
- extendedWaitUntil:
    visible:
      id: terminal-toolbar
    timeout: 5000
- assertNotVisible:
    id: composer-input
- takeScreenshot: design/atlas/sim/03-agent-terminal
- tapOn:
    id: toolbar-compose
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 4000
- assertNotVisible:
    id: terminal-toolbar
- tapOn:
    id: composer-input
- extendedWaitUntil:
    visible:
      id: composer-more
    timeout: 4000
- inputText: "ls"
- waitForAnimationToEnd
- takeScreenshot: design/atlas/sim/03-agent-terminal-keyboard
- tapOn:
    id: composer-more
    retryTapIfNoChange: false
# "..." is a panel over the Composer now (rows scroll inside it): the first row is on screen.
- extendedWaitUntil:
    visible: "Back to Console"
    timeout: 4000
- runFlow: _guard.yaml
# Back to Keys from the Composer, so the next flow starts on the default.
- tapOn:
    id: composer-more-panel-close
    optional: true
- tapOn:
    id: composer-bar-toggle
- extendedWaitUntil:
    visible:
      id: terminal-toolbar
    timeout: 4000
- runFlow: _guard.yaml
