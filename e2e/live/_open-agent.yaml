# Opens the lab's Agent (pane PANE, w1:p1) from its Sessions card on Home (an idle Agent is not
# in the inbox; the card id is `session-<host id><separator><pane>`), on its Chat.
appId: com.openagentspocket.app
---
- launchApp
- openLink: openagentspocket:///
- extendedWaitUntil:
    visible:
      id: "session-.*${PANE}"
    timeout: 30000
# If the notification sheet is still up (02-add-host answers it), answer Not Now.
- runFlow:
    when:
      visible:
        id: notification-primer-secondary
    commands:
      - tapOn:
          id: notification-primer-secondary
      - waitForAnimationToEnd
- tapOn:
    id: "session-.*${PANE}"
- extendedWaitUntil:
    visible:
      id: agent-header
    timeout: 20000
- runFlow: ../sim/_guard.yaml
